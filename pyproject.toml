[project]
name = "meet-transcript-agent"
version = "0.1.0"
description = "Meeting transcript RAG agent powered by whisper.cpp"
readme = "README.md"
authors = [
    { name = "bogdanstebelskiy", email = "bogdanstebelskiy@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain-chroma>=1.1.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.13",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pydantic-settings>=2.15.0",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
meet-transcript-agent = "meet_transcript_agent.cli:app"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
